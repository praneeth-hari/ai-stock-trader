name: Monthly Model Retrain

# Schedule paused for the V1 local-only forward-paper period (see V1_FREEZE_REPORT.md).
# The local task "AI-Stock-Trader-Monthly-Retrain" still generates approval-gated candidates;
# CI has no active model and uses a remote database V1 no longer trades.
# Former schedule: - cron: '30 4 1-7 * 6'   # first Saturday 10:00 AM IST
on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Retrain AI model
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python -m src.ml.retrain
