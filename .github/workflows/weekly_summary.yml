name: Weekly Summary

# Schedule paused for the V1 local-only forward-paper period (see V1_FREEZE_REPORT.md).
# It reports on the remote database, not the local V1 portfolio; the local task
# "AI-Stock-Trader-Weekly-Summary" sends the V1 weekly summary.
# Former schedule: - cron: '30 3 * * 0'   # Sunday 9:00 AM IST
on:
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Send weekly summary
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python -m src.reports.weekly_summary
