name: Daily Trading Pipeline

# DISABLED for the V1 local-only forward-paper period (see V1_FREEZE_REPORT.md).
# This machine's Task Scheduler task "AI-Stock-Trader-Daily" is the single trading runner.
# CI has no frozen model and trades a separate remote database, so it must not run.
# Former schedule, restore only when V1 is deliberately moved to CI:
#   - cron: '30 20 * * 1-5'   # 2:00 AM IST, US markets
#   - cron: '30 10 * * 1-5'   # 4:00 PM IST, Indian markets
on:
  workflow_dispatch:

jobs:
  trade:
    if: ${{ false }}  # hard off: even a manual dispatch cannot run the trading pipeline
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run trading pipeline
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        EMAIL_ALERTS_ENABLED: false
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python -m src.pipeline.scheduler --force

    - name: Notify success
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="✅ GitHub Actions: Pipeline completed successfully!"

    - name: Notify failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="❌ GitHub Actions: Pipeline FAILED! Check logs at github.com/praneeth-hari/ai-stock-trader/actions"

